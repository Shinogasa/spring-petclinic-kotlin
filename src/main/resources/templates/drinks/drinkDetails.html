<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body},'drinks')}">

<body>

<h2>Drink Record Details</h2>

<table class="table table-striped" th:object="${drink}">
    <tr>
        <th>Name</th>
        <td><b th:text="*{name}"></b></td>
    </tr>
    <tr>
        <th>Type</th>
        <td th:text="*{type?.name}"></td>
    </tr>
    <tr>
        <th>Drink Date</th>
        <td th:text="${#temporals.format(drink.drinkDate, 'yyyy-MM-dd')}"></td>
    </tr>
    <tr>
        <th>Rating</th>
        <td th:text="*{rating}"></td>
    </tr>
    <tr>
        <th>Notes</th>
        <td th:text="*{notes}"></td>
    </tr>
</table>

<a th:href="@{/drinks}" class="btn btn-primary">Back to List</a>

</body>

</html>
