<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'drinks')}">

  <body>

    <h2>Drinks Record</h2>

    <table id="drinks" class="table table-striped">
        <thead>
        <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Drink Date</th>
            <th>Rating</th>
            <th>Notes</th>
        </tr>
        </thead>
        <tbody>
          <tr th:each="drink : ${drinks}">
              <td>
                  <a th:href="@{/drinks/__${drink.id}__}" th:text="${drink.name}"/></a>
              </td>
              <td th:text="${drink.type?.name}"/>
              <td th:text="${#temporals.format(drink.drinkDate, 'yyyy-MM-dd')}"/>
              <td th:text="${drink.rating}"/>
              <td th:text="${drink.notes}"/>
          </tr>
        </tbody>
    </table>

    <a th:href="@{/drinks/new}" class="btn btn-primary">Add New Record</a>

  </body>
</html>
